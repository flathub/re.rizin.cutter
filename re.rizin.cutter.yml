app-id: re.rizin.cutter
command: cutter
runtime: org.kde.Platform
runtime-version: '6.11'
separate-locales: false
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
build-options:
  prepend-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --allow=devel

add-extensions:
  re.rizin.cutter.plugin:
    version: stable
    directory: extensions
    add-ld-path: lib
    merge-dirs: plugins;bin;lib
    subdirectories: true
    no-autodownload: true

modules:

  - name: pyside
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cxxflags: -I/run/build/pyside/sources/shiboken6/libshiboken/signature -I/usr/include/python3.13
      cflags: -I/usr/include/python3.13
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DCMAKE_SKIP_RPATH:BOOL=YES
      - -DFORCE_LIMITED_API=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.2-src/pyside-setup-everywhere-src-6.11.2.tar.xz
        sha256: cba47efbaad1bedd529725cbc14e21f156c7a19366f07b3edfbb076ffd7afdf8
      - type: shell
        commands:
          - cp -R /usr/include/Qt* sources/pyside6/PySide6/
    modules:
      # since 6.11 the generator lives in its own source dir and provides the
      # Shiboken6Tools package (Shiboken6::shiboken6), which both shiboken6
      # and cutter find_package(), so it has to be built and installed first
      - name: shiboken-generator
        buildsystem: cmake-ninja
        builddir: true
        subdir: sources/shiboken6_generator
        config-opts:
          - -DBUILD_TESTS=OFF
        sources:
          - type: archive
            url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.2-src/pyside-setup-everywhere-src-6.11.2.tar.xz
            sha256: cba47efbaad1bedd529725cbc14e21f156c7a19366f07b3edfbb076ffd7afdf8

      # needed as the cmake super project doesn't find the shiboken python module
      - name: shiboken
        buildsystem: cmake-ninja
        builddir: true
        subdir: sources/shiboken6
        config-opts:
          - -DBUILD_TESTS=OFF
          - -DFORCE_LIMITED_API=OFF
        sources:
          - type: archive
            url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.2-src/pyside-setup-everywhere-src-6.11.2.tar.xz
            sha256: cba47efbaad1bedd529725cbc14e21f156c7a19366f07b3edfbb076ffd7afdf8

  - name: rizin
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Drizin_plugins=extensions/lib/rizin/plugins
      - -Dinstall_sigdb=true
      - -Dsubprojects_check=false # we manually add sigdb subproject
    sources:
      - type: archive
        url: https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-src-v0.9.1.tar.xz
        sha256: 7ac1cd7daca7afdda742e15478b1f747fc1f813e496fee71839d1e109e543dca
      - type: git
        url: https://github.com/rizinorg/sigdb
        commit: 4addbed50cd3b50eeef5a41d72533d079ebbfbf8
        dest: subprojects/sigdb

  - name: graphviz
    buildsystem: autotools
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.0/graphviz-16.1.0.tar.xz
        sha256: 0f661718f3e5268dc3bad0fb53ab646605d26db70f4080799aff1dc2f61783c3

  - name: cutter
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCUTTER_USE_BUNDLED_RIZIN=off
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCUTTER_ENABLE_KSYNTAXHIGHLIGHTING=off
      - -DCUTTER_ENABLE_PYTHON=on
      - -DCUTTER_ENABLE_PYTHON_BINDINGS=on
      - -DCUTTER_EXTRA_PLUGIN_DIRS=/app/extensions/plugins
      - -DSHIBOKEN_EXTRA_OPTIONS="-I/app/qtincludes"
    sources:
      - type: shell
        commands:
          # quick hack because shiboken ignores system includes
          - mkdir -p /app/qtincludes && ln -s /usr/include/Qt* /app/qtincludes
      - type: archive
        url: https://github.com/rizinorg/cutter/releases/download/v2.5.0/Cutter-v2.5.0-src.tar.gz
        sha256: b524208f2b09fa5edb6720db007f2f8013089d64bebd87aabd147f79bf5f40b9
      - type: patch
        path: 0001-fix-Handle-python-3.11-and-higher.patch
      - type: patch
        path: 0002-patch-add-missing-informations-for-flathub-build-pip.patch
    post-install:
      - rm -rf /app/qtincludes
      - mkdir -p /app/extensions
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/re.rizin.cutter.desktop
      - install -Dm644 --target=${FLATPAK_DEST}/share/metainfo/ ../src/re.rizin.cutter.appdata.xml
      - install -Dm644 ../src/img/cutter.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
